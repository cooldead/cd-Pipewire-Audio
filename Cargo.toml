[package]
name = "cd-active-app-volume"
version = "0.5.0"
authors = ["Stephane Jourdois <stephane@jourdois.fr>"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
# OpenDeck / Stream Deck plugin SDK — handles the Elgato WebSocket protocol.
openaction = "2.7"

# Native PipeWire bindings. Requires system packages at build time:
#   libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev pkg-config
pipewire = "0.10"

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
anyhow = "1.0"
log = "0.4"
simplelog = "0.12"
# Session-bus service used by the KDE/KWin helper to report the focused window PID.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[[bin]]
name = "cd-active-app-volume"
path = "src/main.rs"
